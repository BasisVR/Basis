name: proton-capture-test

on:
  workflow_dispatch:
  push:
    branches:
      - test/proton-capture

defaults:
  run:
    shell: bash

env:
  NATIVE_DIR: Basis/Packages/com.basis.mediaplayer/Native~
  CARGO_TERM_COLOR: always

jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.NATIVE_DIR }}
          key: release-capture-helper
      - name: Build + strip the capture helper (glibc 2.28)
        working-directory: ${{ env.NATIVE_DIR }}
        run: |
          pip install ziglang cargo-zigbuild
          LIBOPUS_STATIC=1 cargo zigbuild --release -p media-capture --bin basis-capture-helper --target x86_64-unknown-linux-gnu.2.28
          strip --strip-all -o basis-capture-helper target/x86_64-unknown-linux-gnu/release/basis-capture-helper
      - uses: actions/upload-artifact@v4
        with:
          name: capture-helper
          path: ${{ env.NATIVE_DIR }}/basis-capture-helper

  probe:
    needs: helper
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Allow long paths (deep package prefix)
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.NATIVE_DIR }}
          key: wine-probe
      - name: Install NASM (rav1d x86 assembly)
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: capture-helper
          path: ${{ env.NATIVE_DIR }}/capture-helper
      - name: Build the Wine probe with the helper embedded
        working-directory: ${{ env.NATIVE_DIR }}
        run: BASIS_CAPTURE_HELPER="$PWD/capture-helper/basis-capture-helper" cargo build --release -p media-capture --example wine_probe
      - uses: actions/upload-artifact@v4
        with:
          name: wine-probe
          path: ${{ env.NATIVE_DIR }}/target/release/examples/wine_probe.exe

  run-arch:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [wine, proton]
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install the desktop, portal and Wine
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed sway foot ttf-dejavu dbus pipewire wireplumber xdg-desktop-portal \
            xdg-desktop-portal-wlr xorg-xwayland ffmpeg grim openh264 python which tar curl util-linux
          if [ "${{ matrix.mode }}" = wine ]; then
            pacman -S --noconfirm --needed wine
          fi
          useradd -m tester
          mkdir -p /tmp/.X11-unix && chmod 1777 /tmp/.X11-unix
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wine-probe
          path: probe
      - name: Install umu-launcher
        if: matrix.mode == 'proton'
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/Open-Wine-Components/umu-launcher/releases/latest \
            | python3 -c "import json,sys; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if 'zipapp' in a['name']))")
          mkdir -p /opt/umu && curl -fsSL "$url" | tar -x -C /opt/umu
          chmod -R a+rX /opt/umu && find /opt/umu -name umu-run -type f -exec chmod a+rx {} +
          echo "UMU_RUN=$(find /opt/umu -name umu-run -type f | head -1)" >> "$GITHUB_ENV"
          ge=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest             | python3 -c "import json,sys; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('.tar.gz')))")
          mkdir -p /opt/proton && curl -fsSL "$ge" | tar -xz -C /opt/proton
          chmod -R a+rX /opt/proton
          echo "PROTONPATH=$(dirname "$(find /opt/proton -maxdepth 2 -name proton -type f | head -1)")" >> "$GITHUB_ENV"
      - name: Run the probe
        run: |
          mkdir -p "out-arch-${{ matrix.mode }}"
          chown -R tester "$PWD"
          runuser -u tester -- env UMU_RUN="${UMU_RUN:-}" PROTONPATH="${PROTONPATH:-}" HOME=/home/tester bash "$NATIVE_DIR/tools/wine-capture-test.sh" ${{ matrix.mode }} probe/wine_probe.exe "out-arch-${{ matrix.mode }}" 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-arch-${{ matrix.mode }}
          path: |
            out-arch-${{ matrix.mode }}/*.log
            out-arch-${{ matrix.mode }}/*.txt
            out-arch-${{ matrix.mode }}/*.png
            out-arch-${{ matrix.mode }}/probe.h264

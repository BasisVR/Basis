[package]
name = "media-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "basis_media"
crate-type = ["cdylib", "rlib"]

[features]
rist = ["media-engine/rist"]

[dependencies]
media-clock = { workspace = true }
media-diag = { workspace = true }
media-engine = { workspace = true }
media-present = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
decode-mediacodec = { workspace = true }

[lints]
workspace = true
